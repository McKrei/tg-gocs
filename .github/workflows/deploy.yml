name: Deploy Bot to Server

on:
  push:
    branches:
      - main

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
      OPENROUTER_API_KEY: "sk-or-v1-mock-key-for-testing"
      MINIMAX_API_KEY: "sk-cp-mock-key-for-testing"
      GDRIVE_ROOT_FOLDER_ID: "1a2b3c4d5e6f7g8h9i0j-mock-root-id"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Run Linting
        run: make lint

      - name: Run Tests
        run: make test

  deploy:
    runs-on: ubuntu-latest
    needs: lint_and_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /root/tg-gocs
            git pull origin main
            make up
            sleep 10
            CONTAINER_STATUS=$(docker ps --filter name=tg-gocs --format '{{.Status}}')
            if echo "$CONTAINER_STATUS" | grep -q "Up"; then
              echo "✅ Контейнер запущен: $CONTAINER_STATUS"
            else
              echo "❌ Контейнер не запустился!"
              docker logs tg-gocs --tail 50
              exit 1
            fi

      - name: Send Telegram Success Notification
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          TEXT=$(printf "🚀 <b>Деплой tg-gocs успешно завершен!</b>\n\n<b>Коммит:</b> <a href='https://github.com/%s/commit/%s'>%s</a>\n<b>Автор:</b> %s" "$REPO" "$SHA" "$CLEAN_MSG" "$COMMIT_AUTHOR")
          
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$TEXT" \
            --data-urlencode "disable_web_page_preview=true"

      - name: Send Telegram Failure Notification
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          TEXT=$(printf "❌ <b>Ошибка деплоя tg-gocs!</b>\n\n<b>Коммит:</b> <a href='https://github.com/%s/commit/%s'>%s</a>\n<b>Автор:</b> %s" "$REPO" "$SHA" "$CLEAN_MSG" "$COMMIT_AUTHOR")
          
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$TEXT" \
            --data-urlencode "disable_web_page_preview=true"


